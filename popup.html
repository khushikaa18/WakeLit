<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>WakeLit</h1>
    </header>

    <div class="add-form">
      <input type="text" id="urlInput" placeholder="https://your-app.streamlit.app" />
      <button id="addBtn" class="btn-primary">Watch this app</button>
    </div>

    <ul id="appList"></ul>
    <div class="settings-row">
      <label for="intervalSelect">Check every</label>
      <select id="intervalSelect">
        <option value="60">1 hour</option>
        <option value="180">3 hours</option>
        <option value="360">6 hours</option>
        <option value="720">12 hours</option>
      </select>
    </div>
    <button id="checkAllBtn" class="btn-secondary">Check all now</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
